<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海绵宝宝骑自行车</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #15263b;
      --cream: #fff7de;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #07182b;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .scene {
      width: min(100vw, 1200px);
      aspect-ratio: 12 / 7.6;
      min-height: 520px;
      filter: drop-shadow(0 24px 44px rgba(0, 0, 0, .35));
    }

    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 7s linear infinite; }
    .sponge { transform-box: fill-box; transform-origin: center bottom; animation: bounce 1.8s ease-in-out infinite; }
    .bubble { animation: float 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .bubble:nth-of-type(2n) { animation-delay: -2s; }
    .bubble:nth-of-type(3n) { animation-delay: -3.5s; }
    .speed-line { animation: dash 1.2s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0) scale(1); opacity: .55; } 50% { transform: translateY(-18px) scale(1.08); opacity: .95; } }
    @keyframes dash { to { stroke-dashoffset: -120; } }
  </style>
</head>
<body>
  <svg class="scene" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
    <title id="title">海绵宝宝骑自行车</title>
    <desc id="desc">一只快乐的黄色海绵宝宝在海底小路上骑着红色自行车，周围有气泡和珊瑚。</desc>

    <defs>
      <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#23b9d0" />
        <stop offset="0.55" stop-color="#157fa8" />
        <stop offset="1" stop-color="#0b4f79" />
      </linearGradient>
      <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#f9d994" />
        <stop offset="1" stop-color="#d99b61" />
      </linearGradient>
      <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="#fff45c" />
        <stop offset="1" stop-color="#f2c92c" />
      </linearGradient>
      <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="#ff656b" />
        <stop offset="1" stop-color="#cc2f4d" />
      </linearGradient>
      <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
        <feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#08283e" flood-opacity=".35" />
      </filter>
      <pattern id="sandDots" width="58" height="32" patternUnits="userSpaceOnUse">
        <circle cx="8" cy="12" r="2" fill="#bd7d52" opacity=".28" />
        <circle cx="41" cy="22" r="3" fill="#bd7d52" opacity=".2" />
        <circle cx="27" cy="5" r="1.6" fill="#fff1b5" opacity=".5" />
      </pattern>
    </defs>

    <!-- underwater postcard background -->
    <rect width="1200" height="760" rx="38" fill="url(#water)" />
    <path d="M0 115 C180 76 320 166 500 116 S850 66 1200 126 V0 H0Z" fill="#a1eff0" opacity=".16" />
    <path d="M0 330 C165 288 285 364 440 328 S780 272 940 326 S1090 366 1200 334" fill="none" stroke="#9fe9ea" stroke-width="16" opacity=".12" />
    <path d="M0 350 C165 308 285 384 440 348 S780 292 940 346 S1090 386 1200 354" fill="none" stroke="#e4ffff" stroke-width="4" opacity=".18" />

    <!-- bubbles -->
    <g fill="none" stroke="#d8ffff" stroke-width="5" opacity=".7">
      <g class="bubble"><circle cx="102" cy="154" r="16" /><circle cx="70" cy="218" r="7" /></g>
      <g class="bubble"><circle cx="1080" cy="166" r="25" /><circle cx="1128" cy="112" r="10" /></g>
      <g class="bubble"><circle cx="932" cy="113" r="11" /><circle cx="966" cy="80" r="5" /></g>
      <g class="bubble"><circle cx="218" cy="88" r="8" /><circle cx="244" cy="52" r="4" /></g>
    </g>

    <!-- coral and seaweed -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M82 590 C58 540 80 486 106 454 M106 590 C105 548 134 523 145 484 M106 550 C75 534 64 507 62 480" fill="none" stroke="#e87973" stroke-width="19" />
      <path d="M1055 592 C1033 527 1052 466 1080 416 M1080 527 C1120 505 1138 471 1133 433 M1080 490 C1054 468 1049 438 1058 413" fill="none" stroke="#c85d99" stroke-width="20" />
      <path d="M168 592 C158 548 171 515 190 484 M190 555 C217 537 227 511 222 482 M1010 592 C1004 536 994 507 972 477 M972 544 C950 524 946 500 954 478" fill="none" stroke="#50bd83" stroke-width="13" />
      <g fill="#ffb969" stroke="#c95e57" stroke-width="4">
        <circle cx="79" cy="449" r="12" /><circle cx="145" cy="478" r="11" /><circle cx="1078" cy="410" r="12" /><circle cx="1133" cy="430" r="10" />
      </g>
    </g>

    <!-- sandy road -->
    <path d="M0 584 Q300 526 610 574 T1200 555 V760 H0Z" fill="url(#sand)" />
    <path d="M0 584 Q300 526 610 574 T1200 555 V760 H0Z" fill="url(#sandDots)" opacity=".8" />
    <path d="M0 581 Q300 524 610 571 T1200 552" fill="none" stroke="#ffeab1" stroke-width="9" opacity=".8" />

    <!-- speed lines -->
    <g class="speed-line" fill="none" stroke="#f9f3c4" stroke-width="8" stroke-linecap="round" stroke-dasharray="24 26" opacity=".72">
      <path d="M124 444 H266" /><path d="M184 410 H310" /><path d="M860 402 H1010" /><path d="M918 438 H1082" />
    </g>

    <!-- bicycle -->
    <g filter="url(#softShadow)" stroke="#15263b" stroke-linecap="round" stroke-linejoin="round">
      <g fill="none" stroke-width="10">
        <circle class="wheel" cx="320" cy="558" r="92" fill="#183349" stroke-width="8" />
        <circle class="wheel" cx="792" cy="558" r="92" fill="#183349" stroke-width="8" />
        <circle cx="320" cy="558" r="70" stroke="#d8f5ed" stroke-width="5" opacity=".85" />
        <circle cx="792" cy="558" r="70" stroke="#d8f5ed" stroke-width="5" opacity=".85" />
        <path d="M320 558 L452 435 L605 560 L320 558 L526 558 L452 435 M605 560 L792 558 M605 560 L672 427 L792 558" stroke="#e7465a" stroke-width="15" />
        <path d="M672 427 L716 420 M706 421 L729 394" stroke="#15263b" stroke-width="9" />
        <path d="M715 393 q18 -18 38 -2" fill="none" stroke="#e7465a" stroke-width="10" />
        <path d="M438 435 L474 435" stroke="#15263b" stroke-width="15" />
        <path d="M448 435 L424 394" stroke="#15263b" stroke-width="11" />
      </g>
      <g class="wheel" fill="none" stroke="#d8f5ed" stroke-width="3" opacity=".72">
        <path d="M320 466 V650 M228 558 H412 M255 493 L385 623 M385 493 L255 623" />
        <path d="M792 466 V650 M700 558 H884 M727 493 L857 623 M857 493 L727 623" />
      </g>
      <g fill="#f3c52e" stroke-width="7">
        <circle cx="526" cy="558" r="19" />
        <path d="M526 558 l32 20 M526 558 l-27 -21" fill="none" />
        <circle cx="558" cy="578" r="7" /><circle cx="499" cy="537" r="7" />
      </g>
      <path d="M486 470 q34 -20 68 0" fill="none" stroke="#15263b" stroke-width="14" />
    </g>

    <!-- SpongeBob character -->
    <g class="sponge" filter="url(#softShadow)" stroke="#15263b" stroke-linecap="round" stroke-linejoin="round">
      <!-- legs behind the bike -->
      <path d="M492 446 L470 536" fill="none" stroke="#f0cd38" stroke-width="23" />
      <path d="M571 446 L620 527" fill="none" stroke="#f0cd38" stroke-width="23" />
      <path d="M464 536 q-34 5 -38 22 q32 17 70 2 l-12 -19" fill="#1d2940" stroke-width="7" />
      <path d="M617 526 q26 -10 42 6 q-14 29 -60 14 l2 -19" fill="#1d2940" stroke-width="7" />

      <!-- body -->
      <path d="M416 188 Q426 168 447 174 Q466 157 486 173 Q511 153 532 174 Q559 153 579 176 Q604 160 625 185 L621 382 Q614 410 592 421 Q551 437 463 419 Q430 410 421 384Z" fill="url(#yellow)" stroke-width="8" />

      <!-- sponge pores -->
      <g fill="#d7ad26" stroke="none" opacity=".78">
        <ellipse cx="448" cy="210" rx="10" ry="15" /><circle cx="588" cy="203" r="9" /><ellipse cx="454" cy="344" rx="13" ry="8" />
        <circle cx="584" cy="343" r="12" /><circle cx="434" cy="294" r="7" /><ellipse cx="612" cy="275" rx="7" ry="11" />
      </g>
      <g fill="#fff780" stroke="none" opacity=".7"><circle cx="470" cy="191" r="5" /><circle cx="605" cy="228" r="5" /><circle cx="507" cy="385" r="6" /></g>

      <!-- face -->
      <g fill="#fff" stroke-width="6">
        <ellipse cx="482" cy="245" rx="32" ry="42" /><ellipse cx="554" cy="245" rx="32" ry="42" />
      </g>
      <g fill="#1d5f77" stroke-width="4">
        <ellipse cx="487" cy="252" rx="12" ry="18" /><ellipse cx="549" cy="252" rx="12" ry="18" />
      </g>
      <g fill="#15263b" stroke="none"><circle cx="489" cy="255" r="6" /><circle cx="547" cy="255" r="6" /></g>
      <path d="M513 258 q-8 24 -19 37 q18 10 34 0" fill="#f0bf37" stroke-width="5" />
      <path d="M476 311 q35 29 78 0 q-6 51 -41 51 q-31 0 -37 -51Z" fill="#fff" stroke-width="6" />
      <path d="M486 339 q26 14 52 0" fill="none" stroke="#e74456" stroke-width="5" />
      <path d="M496 358 l-5 13 M528 358 l5 13" stroke-width="4" />

      <!-- shirt, tie, trousers -->
      <path d="M421 383 Q506 400 621 382 L625 438 Q547 456 416 437Z" fill="#fff" stroke-width="7" />
      <path d="M510 401 l13 0 l14 38 l-21 20 l-20 -20Z" fill="#e74456" stroke-width="5" />
      <path d="M420 436 Q508 451 624 436 L616 485 Q530 505 428 485Z" fill="#8d5736" stroke-width="8" />
      <path d="M478 448 v36 M563 448 v37" stroke="#f3d05d" stroke-width="5" />

      <!-- arms to handlebars -->
      <path d="M424 388 q-43 25 -64 3 q-14 -15 7 -26 l58 -24" fill="none" stroke="#f0cd38" stroke-width="20" />
      <path d="M616 388 q41 28 65 -4 q12 -16 -9 -27 l-47 -17" fill="none" stroke="#f0cd38" stroke-width="20" />
      <path d="M364 364 q-18 5 -17 19 q13 8 27 -2 M670 357 q16 7 12 20 q-15 7 -27 -4" fill="none" stroke="#f0cd38" stroke-width="13" />
    </g>

    <!-- foreground bubbles and caption -->
    <g fill="none" stroke="#d8ffff" stroke-width="4" opacity=".65">
      <circle cx="256" cy="668" r="13" /><circle cx="282" cy="697" r="6" /><circle cx="931" cy="653" r="17" />
    </g>
    <g transform="translate(72 68)">
      <rect width="282" height="68" rx="34" fill="#083c64" opacity=".82" stroke="#a5f3ed" stroke-width="3" />
      <text x="141" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#fff8d5" letter-spacing="2">Bikini Bottom Ride!</text>
    </g>
  </svg>
</body>
</html>
