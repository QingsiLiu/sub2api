<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c1eeea">
  <title>海绵宝宝的快乐骑行</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(12px, 3vw, 40px);
      background: #eaf7f3;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(100%, 1200px);
      overflow: hidden;
      border: 8px solid #fffdf5;
      border-radius: 30px;
      background: #c1eeea;
      box-shadow: 0 25px 70px #285c6420, 0 4px 12px #285c6410;
    }
    svg { display: block; width: 100%; height: auto; }
    @media (max-width: 600px) {
      main { border-width: 4px; border-radius: 18px; }
    }
  </style>
</head>

        </g>
        <g id="wheel" stroke="#303e47">

          <circle r="94" fill="#daf3e7" stroke="#fafaf0" stroke-width="5"/>
