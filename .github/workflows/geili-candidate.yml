name: Geili staging candidate
on:
  push:
    branches: ['geili/main', 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: geili-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Frontend validation and upstream visual build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test:run
          pnpm build
      - name: Validate subscriptions and compile candidate
        working-directory: backend
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          VERSION="$(tr -d '[:space:]' < cmd/server/VERSION)"
          test -n "$VERSION"
          echo "GEILI_VERSION=$VERSION" >> "$GITHUB_ENV"
          go test ./...
          go test -tags=unit ./...
          CI=true go test -tags=integration ./...
          go test -race -tags=unit ./internal/geili/subscription ./internal/service ./internal/repository ./internal/server/middleware -run 'Lot|Entitlement|SubscriptionAudit|SubscriptionAdmission|UpstreamDispatch|Contract|SubscriptionBillingV2|SubscriptionV2|SubscriptionQuotaGeili' -count=1
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embed -trimpath -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${CANDIDATE_SHA} -X main.BuildType=release" -o ../sub2api ./cmd/server
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable candidate tag
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.goreleaser
          platforms: linux/amd64
          push: true
          tags: ghcr.io/qingsiliu/sub2api:acceptance-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.GEILI_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/QingsiLiu/sub2api
      - name: Record artifact identity
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          printf '{"revision":"%s","image":"ghcr.io/qingsiliu/sub2api@%s"}\n' "$REVISION" "$DIGEST" > candidate.json
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,os
          files=sorted(pathlib.Path('backend/migrations').glob('*.sql'))
          migrations={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          record={'revision':os.environ['REVISION'],'image':'ghcr.io/qingsiliu/sub2api@'+os.environ['DIGEST'],'gates':{'frontend_full':'passed','go_default':'passed','go_unit':'passed','go_integration':'passed','subscription_race':'passed'},'migration_checksums':migrations,'production_ready':False,'remaining':['stage_business_acceptance','external_sandbox_and_limited_upstream_acceptance','explicit_production_authorization']}
          pathlib.Path('candidate-gates.json').write_text(json.dumps(record,indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v7
        with:
          name: geili-candidate
          path: |
            candidate.json
            candidate-gates.json
